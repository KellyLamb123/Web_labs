<!DOCTYPE html>
<html lang="ru">
  
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин</title>
  <link rel="stylesheet" href="style.css">
  
</head>

<body>
  
<header class="header">
<h1>Мой магазин</h1>
</header>

<main class="main">
  
  <section class="catalog">
    
    <h2>Каталог товаров</h2>
    
    <div class="products">

      <!-- товар 1 -->
      <article class="product">
        
        <h3>Футболка</h3>
        <p class="price">1500 ₽</p>
        
        <button
          
          class="add-button"
          data-id="1"
          data-name="Футболка"
          data-price="1500">
          Добавить в корзину
          
        </button>
        
      </article>
      
      <!-- товар 2 -->
      
      <article class="product">
        
        <h3>Джинсы</h3>
        <p class="price">1800 ₽</p>
        
        <button
          
          class="add-button"
          data-id="2"
          data-name="Джинсы"
          data-price="1800">
          Добавить в корзину
          
        </button>
        
      </article>

      <!-- товар 3 -->
      
      <article class="product">
        
        <h3>Куртка</h3>
        <p class="price">6600 ₽</p>
        
        <button
          
          class="add-button"
          data-id="3"
          data-name="Куртка"
          data-price="6600">
          Добавить в корзину
          
        </button>

      </article>
      
        <!-- товар 4 -->
      
      <article class="product">
        
        <h3>Кроссовки</h3>
        <p class="price">4000 ₽</p>
        
        <button
          
          class="add-button"
          data-id="4"
          data-name="Куртка"
          data-price="4000">
          Добавить в корзину
          
        </button>
        
      </article>
      
    </div>
    
  </section>

  <!-- Корзина -->

  <aside class="cart">

    <h2>Корзина</h2>

    <div id="cart-items">

      <p>Корзина пуста</p>

    </div>

    <h3>Итого:
      <span id="total-price">0</span>₽
    </h3>

    <button id="checkout-button">Оформить заказ</button>

  </aside>

</main>

<div id="modal" class="modal">

  <div class="modal-content">

    <button
      
      id="close-modal"
      class="close-button">
      ×
      
    </button>

    <h2>Оформление заказа</h2>

    <form id="order-form">
      
      <label for="name">Имя</label>

      <input
        
        type="text"
        id="name"
        required
        
      >

      <label for="surname">Фамилия</label>

      <input
          
        type="text"
        id="surname"
        required
          
      >

      <label for="address">Адрес доставки</label>
      
      <input
        
        type="text"
        id="address"
        required
        
      >

      <label for="phone">Номер телефона</label>

      <input
        
        type="tel"
        id="phone"
        required
      
      >

      <button type="submit">Создать заказ</button>

    </form>

  </div>

</div>
  
<footer class="footer">

  <p>Магазин 2026</p>

</footer>

<!-- JS -->
  
<script src="script.js"></script>

</body>

</html>
