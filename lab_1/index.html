<!DOCTYPE html>
<html lang="ru">
  
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин</title>
  <link rel="stylesheet" href="style.css">
  
</head>

<body>
  
<header class="header">
<h1>Мой первый магазин</h1>
</header>

<main class="main">
  
  <section class="catalog">
    
    <h2>Каталог товаров</h2>
    
    <div class="products">

      <!-- товар 1 -->
      <article class="product">
        
        <h3>Футболка</h3>
        <p class="price">1500 ₽</p>
        
        <button
          
          class="add-button"
          data-id="1"
          data-name="Футболка"
          data-price="1500">
          Добавить в корзину
          
        </button>
        
      </article>
      
      <!-- товар 2 -->
      
      <article class="product">
        
        <h3>Джинсы</h3>
        <p class="price">1800 ₽</p>
        
        <button
          
          class="add-button"
          data-id="2"
          data-name="Джинсы"
          data-price="1800">
          Добавить в корзину
          
        </button>
        
      </article>

      <!-- товар 3 -->
      
      <article class="product">
        
        <h3>Куртка</h3>
        <p class="price">6600 ₽</p>
        
        <button
          
          class="add-button"
          data-id="3"
          data-name="Куртка"
          data-price="6600">
          Добавить в корзину
          
        </button>

      </article>
      
        <!-- товар 4 -->
      
      <article class="product">
        
        <h3>Кроссовки</h3>
        <p class="price">4000 ₽</p>
        
        <button
          
          class="add-button"
          data-id="4"
          data-name="Куртка"
          data-price="4000">
          Добавить в корзину
          
        </button>
        
      </article>
      
    </div>
    
  </section>

  <aside class="cart">

    <h2>Корзина</h2>

    <div id="cart-items">

      <p>Корзина пуста</p>

    </div>

    <h3>Итого:
      <span id="total-price">0</span>₽
    </h3>

    <button id="checkout-button">Оформить заказ</button>

  </aside>

</main>
